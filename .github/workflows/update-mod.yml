# .github/workflows/update-mod.yml
name: Update Mod from CurseForge

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # needed to trigger the Docker Hub deploy workflow

jobs:
  update-mod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Update launch.sh to latest ServerFiles
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -z "$CURSEFORGE_API_KEY" ]; then
            echo "Missing CURSEFORGE_API_KEY secret"
            exit 1
          fi
          node fetch_latest_server_files.js

      - name: Commit and push changes (if any)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add launch.sh Dockerfile
          git commit -m "chore: bump ServerFiles to latest (CurseForge)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows' `push`
      # events, so explicitly dispatch the Docker Hub build after a bump.
      - name: Trigger Docker Hub image build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-hub.yml --ref main
